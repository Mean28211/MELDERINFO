
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>DRK Bereitschaft | Melder stummschalten</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<style>
:root {
  font-family: Arial, Helvetica, sans-serif;
  color: #20252b;
  background: #f2f3f4;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.sheet {
  width: min(100%,470px);
  background: white;
  border: 1px solid #e0e2e4;
  box-shadow: 0 12px 40px #14202b12;
}
.header {
  padding: 30px 28px 26px;
  display: flex;
  align-items: center;
  gap: 19px;
}
.emblem { width: 62px; height: 62px; flex: none; }
.identity {
  font-size: 19px;
  font-weight: 750;
  line-height: 1.12;
  color: #171b1f;
}
.identity small {
  display: block;
  font-size: 12px;
  letter-spacing: 2px;
  font-weight: 700;
  color: #5a626a;
  margin-top: 9px;
}
.redline { height: 5px; background: #e30613; }
.content { padding: 36px 28px 34px; }
.eyebrow {
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #626b73;
  margin-bottom: 13px;
}
.notice {
  border-left: 5px solid #e30613;
  padding: 5px 0 5px 19px;
  margin-bottom: 40px;
}
.notice h1 {
  font-size: clamp(30px,8vw,43px);
  line-height: 1.11;
  margin: 0;
  font-weight: 800;
  color: #15191d;
  text-transform: uppercase;
}
.notice p {
  margin: 14px 0 0;
  color: #4c555d;
  font-size: 15px;
  line-height: 1.55;
}
.datetime {
  border-top: 1px solid #e1e3e5;
  padding-top: 26px;
}
.dtlabel {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.7px;
  color: #667078;
  text-transform: uppercase;
}
.date { font-size: 17px; font-weight: 600; margin-top: 9px; }
.time {
  font-size: clamp(49px,14vw,66px);
  font-weight: 700;
  letter-spacing: -2px;
  font-variant-numeric: tabular-nums;
  margin-top: 4px;
}
.footer {
  background: #f7f8f8;
  border-top: 1px solid #e4e5e7;
  padding: 18px 28px;
  font-size: 12px;
  color: #667078;
}
@media(max-width:360px) {
  .header { padding: 23px 21px; }
  .content { padding: 30px 21px; }
}
</style>
</head>
<body>
<main class="sheet">
<header class="header">
<svg class="emblem" viewBox="0 0 100 100"
     aria-label="Rotes Kreuz">
  <rect width="100" height="100" fill="white"/>
  <path d="M39 14h22v25h25v22H61v25H39V61H14V39h25z"
        fill="#e30613"/>
</svg>
<div class="identity">
  Deutsches<br>Rotes Kreuz
  <small>BEREITSCHAFT</small>
</div>
</header>
<div class="redline"></div>
<section class="content">
<div class="eyebrow">PERSÖNLICHE ERINNERUNG</div>
<div class="notice">
<h1>Melder<br>stummschalten</h1>
<p>Bitte den Melder an diesem Standort auf lautlos stellen.</p>
</div>
<div class="datetime">
<div class="dtlabel">AKTUELLES DATUM</div>
<div class="date" id="date">–</div>
<div class="dtlabel" style="margin-top:24px">AKTUELLE UHRZEIT</div>
<div class="time" id="time">--:--</div>
</div>
</section>
<footer class="footer">
DRK-Bereitschaft · Erinnerung zur manuellen Einstellung des Melders
</footer>
</main>
<script>
const fmtDate = new Intl.DateTimeFormat('de-DE', {
  weekday:'long',day:'2-digit',month:'long',year:'numeric'
});
const fmtTime = new Intl.DateTimeFormat('de-DE', {
  hour:'2-digit',minute:'2-digit',hour12:false
});
function update() {
  const now = new Date();
  document.getElementById('date').textContent = fmtDate.format(now);
  document.getElementById('time').textContent = fmtTime.format(now);
}
update();
setInterval(update,1000);
document.addEventListener('visibilitychange',update);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(err => console.warn('Offline-Cache:',err));
  });
}
</script>
</body>
</html>
